<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2531">
<title>Protocolo 4D + 5</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="4D+5">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<header class="tope">
  <div class="tope-fila">
    <div class="marca">Protocolo 4D <em>+</em> 5</div>
    <div class="semana">
      <button id="semMenos" aria-label="Semana anterior">−</button>
      <span>Sem <b id="semNum">1</b></span>
      <button id="semMas" aria-label="Semana siguiente">+</button>
      <button id="btnUnidad" class="unidad" aria-label="Cambiar entre kilos y libras">KG</button>
    </div>
  </div>
  <nav class="pestanas" id="pestanas" role="tablist" aria-label="Días de la rutina"></nav>
</header>

<main id="vista"></main>

<div class="reloj" id="reloj">
  <div class="relleno" id="relleno"></div>
  <div class="cuenta" id="cuenta" aria-live="polite">
    <small id="cuentaRotulo">Descanso</small><span id="cuentaTexto">--:--</span>
  </div>
  <div class="acciones">
    <button id="btnMas30">+30s</button>
    <button id="btnSaltar" class="fuerte">Listo</button>
  </div>
</div>

<div class="velo" id="velo" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
  <div class="hoja" id="hoja"></div>
</div>

<div class="actualizar" id="actualizar">
  <span>Hay una versión nueva de la app.</span>
  <button id="btnActualizar">Actualizar</button>
</div>

<div class="aviso-guardado" id="avisoGuardado" role="status">Guardado</div>

<input type="file" id="archivoRespaldo" accept="application/json" hidden>

<script type="module" src="/src/main.js"></script>
</body>
</html>
